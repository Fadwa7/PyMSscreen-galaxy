<svg width="100%" height="260" viewBox="0 0 1600 260" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">

  <!-- background gradient depends on theme -->
  <defs>
    <linearGradient id="bg-light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8f4ff"></stop>
      <stop offset="100%" stop-color="#f6fbff"></stop>
    </linearGradient>

    <linearGradient id="bg-dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1220"></stop>
      <stop offset="100%" stop-color="#0f172a"></stop>
    </linearGradient>

    <!-- blurred chemical structure -->
    <filter id="blurChem" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12"></feGaussianBlur>
    </filter>
  </defs>

  <!--   AUTO-SWITCH background gradient via CSS class  -->
  <rect width="1600" height="260" class="bg-grad"></rect>

  <!-- ghosted chemical structure in the background -->
  <g opacity="0.15" filter="url(#blurChem)" transform="translate(120,40) scale(1.1)">
    <path d="M20 50 L70 20 L120 50 L120 110 L70 140 L20 110 Z" stroke="#b38b00" stroke-width="4" fill="none"></path>
    <circle cx="150" cy="80" r="18" stroke="#0055aa" stroke-width="4" fill="none"></circle>
    <line x1="150" y1="98" x2="150" y2="130" stroke="#0055aa" stroke-width="4"></line>
  </g>

  <!-- MS-style bars -->
  <g stroke-linecap="round" stroke-width="14">
    <!-- left cluster -->
    <line x1="100" y1="200" x2="100" y2="120" stroke="#d1d5db"></line>
    <line x1="150" y1="200" x2="150" y2="80" stroke="#d1d5db"></line>
    <line x1="200" y1="200" x2="200" y2="160" stroke="#4f8ac9"></line>
    <line x1="250" y1="200" x2="250" y2="95" stroke="#4f8ac9"></line>

    <!-- center cluster -->
    <line x1="500" y1="200" x2="500" y2="60" stroke="#4f8ac9"></line>
    <line x1="550" y1="200" x2="550" y2="160" stroke="#d1d5db"></line>
    <line x1="600" y1="200" x2="600" y2="110" stroke="#d1d5db"></line>
    <line x1="650" y1="200" x2="650" y2="140" stroke="#4f8ac9"></line>

    <!-- right cluster -->
    <line x1="950" y1="200" x2="950" y2="100" stroke="#ff5252"></line>
    <line x1="1000" y1="200" x2="1000" y2="150" stroke="#d1d5db"></line>
    <line x1="1050" y1="200" x2="1050" y2="90" stroke="#ff5252"></line>
    <line x1="1100" y1="200" x2="1100" y2="55" stroke="#ff5252"></line>
  </g>

</svg>

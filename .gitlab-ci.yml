stages:
  - test

backend_smoke_tests:
  stage: test
  image: python:3.11-slim
  before_script:
    - cd backend
    - pip install --upgrade pip
    - pip install -r requirements.txt
  script:
    - pytest -q tests --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: backend/report.xml
    expire_in: 1 week

frontend_light_check:
  stage: test
  image: node:20-bullseye
  script:
    - cd frontend
    # 1. Basic structure check
    - test -f package.json
    - test -f package-lock.json

    # 2. Validate JSON syntax
    - node -e "JSON.parse(require('fs').readFileSync('package.json'))"
    - node -e "JSON.parse(require('fs').readFileSync('package-lock.json'))"

    # 3. Ensure key scripts exist
    - node -e "const p=require('./package.json'); if(!p.scripts || !p.scripts.build){process.exit(1)}"

    # 4. Optional: check important deps exist (no install)
    - node -e "const p=require('./package.json'); if(!p.dependencies && !p.devDependencies){process.exit(1)}"

frontend_build:
  stage: test
  image: node:20-bullseye
  script:
    - cd frontend
    - npm install
    - npm run lint || true
    - npm run build
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 1 hour
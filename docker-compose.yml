version: '3.0'

services:
  backend:
    build: ./backend
    container_name: backend    
    ports:
      - "8080:5000"
    environment:
      - PORT=8080
    volumes:
      - ${UPLOADS_PATH}:/app/uploads
    restart: always
    platform: linux/amd64

  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "3000:80"
    restart: always
    depends_on:
      - backend
    platform: linux/amd64

